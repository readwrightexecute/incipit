# BMAD v4-style section schema. Order here is the order sections are drafted
# and assembled into the final mega-prompt.
sections:
  - id: goals
    title: Goals & Background
    instruction: >
      Start with exactly one line: "Epic Summary: <short outcome-based title>".
      The title must name the concrete project outcome, not "Incipit",
      "mega-prompt", or other generic wording. Then write 3-6 Markdown bullet
      points capturing the desired outcomes, followed by one short paragraph of
      background context explaining why this is being built. Capability language
      only — no implementation details.

  - id: functional_requirements
    title: Functional Requirements
    instruction: >
      Write the functional requirements as a Markdown bullet list labeled FR1,
      FR2, ... Each requirement must use SHALL language and be a single
      story-sized, testable statement of WHAT the system does (e.g. "- FR3: The
      system SHALL let users export the result as a markdown file"). Each FR
      should map cleanly to one Jira Story: avoid tiny UI-only steps and avoid
      broad epics disguised as requirements. Cover the core happy path first,
      then secondary behaviors. 5-12 requirements depending on stakes. Do not
      include performance/quality attributes here.

  - id: non_functional_requirements
    title: Non-Functional Requirements
    instruction: >
      Write the non-functional requirements as a Markdown bullet list labeled
      NFR1, NFR2, ... using SHALL language. Cover only the attributes that matter
      for these stakes: performance, security/auth, reliability, resource
      constraints, compatibility. Keep it to 3-7 items. Each must be concrete
      and checkable, not aspirational fluff. Do not invent numeric thresholds,
      vendors, protocols, compliance claims, or deployment choices as facts
      unless they came from the idea, repo context, or clarifications; otherwise
      mark them "[ASSUMPTION]".

  - id: tech_constraints
    title: Tech Constraints & Stack
    instruction: >
      Write a "Tech Constraints & Stack" section: a definitive bullet list of
      the technology choices and constraints a coding agent must respect —
      language/runtime, frameworks, storage, deployment target, existing systems
      to integrate with, and anything explicitly ruled out. Derive choices from
      the user's answers; where the user expressed no preference, choose the
      simplest mainstream option and mark it "[ASSUMPTION]". Do not introduce
      vendors, protocols, compliance claims, or deployment choices as facts unless
      they came from the idea, repo context, or clarifications.

  - id: acceptance_criteria
    title: Acceptance Criteria
    instruction: >
      Write the acceptance criteria as a Markdown bullet list labeled AC1, AC2,
      ... Each criterion must cite the FR ids it validates in brackets, for
      example "- AC1: [FR2, FR5] Given ...". Every FR must be covered by at
      least one acceptance criterion. Each criterion is a concrete, observable
      check in Given/When/Then form or "Done when ..." form. Include at least one
      criterion for error/edge behavior. 5-10 criteria.

  - id: out_of_scope
    title: Out of Scope
    instruction: >
      Write a short "Out of Scope" section: 3-6 bullets explicitly excluding
      things a coding agent might otherwise gold-plate (extra platforms, auth
      systems, scaling work, admin UIs, etc.) based on the stated stakes and
      idea. One line each, no explanations.
