[pytest]
testpaths = tests
pythonpath = .
# Coverage is scoped to the security-critical, fully-offline-testable modules
# (auth/token store, audit log, Jira REST client, markdown→ADF) rather than the
# whole `app` package: the LLM/diffusion backends and wizard orchestration call
# out to a model/subprocess and aren't exercised by the offline suite, so a
# 90% gate over all of `app` is impractical. The auth/export *routes* live in
# app/main.py (alongside every wizard route) and so can't be isolated per-file;
# they're covered by tests/test_jira_auth.py, tests/test_auth.py and
# tests/test_jira_export.py. See README "Testing & coverage".
addopts = -ra --cov=app.auth --cov=app.audit --cov=app.jira --cov=app.markdown_adf --cov-report=term-missing --cov-fail-under=90
