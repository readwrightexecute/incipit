name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  webapp:
    name: webapp pytest + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            webapp/requirements.txt
            webapp/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # Coverage scope + 90% gate are configured in webapp/pytest.ini addopts;
        # the suite is fully offline (no network, no model/subprocess).
        run: pytest -q

  skills:
    name: skills pytest + build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Check generated adapters are up to date
        run: python build.py --check

      - name: Run tests
        # Standard library only — no dependency on the web app.
        run: pytest -q
