<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incipit</title>
  <script>
    // Pre-paint theme resolution — runs before any CSS applies so there is no
    // flash of the wrong theme. Stored pref: "light" | "dark" | absent (system).
    (function () {
      var pref = null;
      try { pref = localStorage.getItem("incipit-theme"); } catch (e) {}
      var dark = pref === "dark" ||
        (pref !== "light" && window.matchMedia &&
         window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="/static/pico.min.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/sse.js"></script>
  <script src="/static/spinner.js"></script>
  <script src="/static/history.js"></script>
  <style>
    /* ================= Consermo design language =================
       Calm, restrained enterprise SaaS: near-monochrome neutral surfaces,
       flat 1px-bordered cards, one trusted-action blue, teal only as an
       "active here" marker, amber = review soon, red = errors only.
       Light default, class-toggled dark; tokens below are verbatim. */

    /* Self-hosted Geist / Geist Mono variable fonts (OFL). */
    @font-face {
      font-family: "Geist Variable";
      src: url("/static/fonts/geist-latin-wght-normal.woff2") format("woff2");
      font-weight: 100 900; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Geist Mono Variable";
      src: url("/static/fonts/geist-mono-latin-wght-normal.woff2") format("woff2");
      font-weight: 100 900; font-style: normal; font-display: swap;
    }

    /* ---- Color tokens: light theme ---- */
    :root {
      color-scheme: light;
      --background: #FFFFFF;
      --foreground: #0A0A0A;
      --card: #FFFFFF;
      --card-foreground: #0A0A0A;
      --popover: #FFFFFF;
      --primary: #2563EB;
      --primary-foreground: #FFFFFF;
      --secondary: #F5F5F5;
      --secondary-foreground: #171717;
      --muted: #F5F5F5;
      --muted-foreground: #737373;
      --accent: #14B8A6;
      --accent-foreground: #042F2E;
      --attention: #F59E0B;
      --attention-foreground: #3B2502;
      --safe: #10B981;
      --safe-foreground: #042F2E;
      --blocked: #DC2626;
      --destructive: #DC2626;
      --blocked-foreground: #FFFFFF;
      --border: #E5E5E5;
      --input: #E5E5E5;
      --ring: #A3A3A3;
    }
    /* ---- Color tokens: dark theme ---- */
    [data-theme="dark"] {
      color-scheme: dark;
      --background: #0A0A0A;
      --foreground: #FAFAFA;
      --card: #171717;
      --card-foreground: #FAFAFA;
      --popover: #171717;
      --primary: #60A5FA;
      --primary-foreground: #08111F;
      --secondary: #262626;
      --secondary-foreground: #FAFAFA;
      --muted: #262626;
      --muted-foreground: #A3A3A3;
      --accent: #5EEAD4;
      --accent-foreground: #042F2E;
      --attention: #FBBF24;
      --attention-foreground: #2A1A00;
      /* --safe / --blocked have no dark variants by design */
      --border: #262626;
      --input: #262626;
      --ring: #737373;
    }

    /* ---- Shared derived tokens + semantic aliases (templates use these) ---- */
    :root, [data-theme="dark"] {
      --danger:  var(--blocked);    /* errors / destructive / failed only */
      --warning: var(--attention);  /* needs review soon, never panic */
      --success: var(--safe);       /* done / applied / healthy */
      --info:    var(--primary);
      --fs-xs: 12px;   /* meta, hints, chips, fine print */
      --fs-sm: 14px;   /* body, controls, labels */
      --sans: "Geist Variable", "Geist Sans", ui-sans-serif, system-ui, sans-serif;
      --mono: "Geist Mono Variable", "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-overlay: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);

      /* ---- Re-point Pico's tokens at the palette (both themes; values
             resolve per-theme through the vars above) ---- */
      --pico-font-family-sans-serif: var(--sans);
      --pico-font-family-monospace: var(--mono);
      --pico-font-family: var(--sans);
      --pico-border-radius: 8px;
      --pico-background-color: var(--background);
      --pico-color: var(--foreground);
      --pico-text-selection-color: color-mix(in srgb, var(--primary) 20%, transparent);
      --pico-h1-color: var(--foreground); --pico-h2-color: var(--foreground);
      --pico-h3-color: var(--foreground); --pico-h4-color: var(--foreground);
      --pico-h5-color: var(--foreground); --pico-h6-color: var(--foreground);
      --pico-muted-color: var(--muted-foreground);
      --pico-muted-border-color: var(--border);
      --pico-card-background-color: var(--card);
      --pico-card-border-color: var(--border);
      --pico-card-sectioning-background-color: var(--card);
      --pico-card-box-shadow: none;
      --pico-modal-overlay-background-color: rgba(0, 0, 0, .5);
      --pico-form-element-background-color: var(--background);
      --pico-form-element-border-color: var(--input);
      --pico-form-element-color: var(--foreground);
      --pico-form-element-placeholder-color: var(--muted-foreground);
      --pico-form-element-active-background-color: var(--background);
      --pico-form-element-active-border-color: var(--ring);
      --pico-form-element-focus-color: color-mix(in srgb, var(--ring) 50%, transparent);
      --pico-form-element-invalid-border-color: var(--blocked);
      --pico-form-element-invalid-active-border-color: var(--blocked);
      --pico-form-element-invalid-focus-color: color-mix(in srgb, var(--blocked) 20%, transparent);
      --pico-primary: var(--primary);
      --pico-primary-background: var(--primary);
      --pico-primary-border: var(--primary);
      --pico-primary-hover: color-mix(in srgb, var(--primary) 90%, transparent);
      --pico-primary-hover-background: color-mix(in srgb, var(--primary) 90%, transparent);
      --pico-primary-hover-border: color-mix(in srgb, var(--primary) 90%, transparent);
      --pico-primary-focus: color-mix(in srgb, var(--ring) 50%, transparent);
      --pico-primary-inverse: var(--primary-foreground);
      --pico-primary-underline: color-mix(in srgb, var(--primary) 40%, transparent);
      --pico-secondary: var(--secondary-foreground);
      --pico-secondary-background: var(--secondary);
      --pico-secondary-border: var(--secondary);
      --pico-secondary-hover: var(--secondary-foreground);
      --pico-secondary-hover-background: color-mix(in srgb, var(--secondary) 80%, transparent);
      --pico-secondary-hover-border: color-mix(in srgb, var(--secondary) 80%, transparent);
      --pico-secondary-focus: color-mix(in srgb, var(--ring) 50%, transparent);
      --pico-secondary-inverse: var(--secondary-foreground);
      --pico-secondary-underline: color-mix(in srgb, var(--muted-foreground) 40%, transparent);
      /* .contrast maps to the secondary treatment — never a second saturated color */
      --pico-contrast: var(--secondary-foreground);
      --pico-contrast-background: var(--secondary);
      --pico-contrast-border: var(--secondary);
      --pico-contrast-hover: var(--secondary-foreground);
      --pico-contrast-hover-background: color-mix(in srgb, var(--secondary) 80%, transparent);
      --pico-contrast-hover-border: color-mix(in srgb, var(--secondary) 80%, transparent);
      --pico-contrast-focus: color-mix(in srgb, var(--ring) 50%, transparent);
      --pico-contrast-inverse: var(--secondary-foreground);
      --pico-code-background-color: var(--muted);
      --pico-code-color: var(--foreground);
      --pico-accordion-border-color: var(--border);
      --pico-accordion-active-summary-color: var(--foreground);
      --pico-accordion-close-summary-color: var(--foreground);
      --pico-accordion-open-summary-color: var(--muted-foreground);
      --pico-dropdown-background-color: var(--popover);
      --pico-dropdown-border-color: var(--border);
      --pico-dropdown-color: var(--foreground);
      --pico-dropdown-hover-background-color: var(--muted);
      --pico-box-shadow: none;
    }

    /* ---- Base typography & page ---- */
    html { font-size: 16px; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: var(--sans);
      font-size: 14px; line-height: 1.43;  /* 14/20 body */
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: var(--sans); }
    /* Display — the step-1 masthead headline */
    hgroup h1 { font-size: 34px; font-weight: 650; line-height: 1.12; letter-spacing: -0.03em; margin-bottom: .25rem; }
    hgroup p { font-size: 14px; color: var(--muted-foreground); }
    h2 { font-size: 24px; font-weight: 650; line-height: 1.18; letter-spacing: -0.02em; }
    h3 { font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--foreground); }
    small { font-size: var(--fs-xs); line-height: 16px; }
    a { color: var(--primary); text-decoration: none; text-underline-offset: 4px; }
    a:hover { text-decoration: underline; }
    ::placeholder { color: var(--muted-foreground); opacity: 1; }

    /* ---- Focus (every interactive element) + disabled ---- */
    a:focus, button:focus, input:focus, textarea:focus, select:focus, summary:focus,
    [role="button"]:focus { outline: none; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible,
    select:focus-visible, summary:focus-visible, [role="button"]:focus-visible {
      outline: none;
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent);
    }
    button[disabled], [role="button"][disabled], input[disabled], select[disabled],
    textarea[disabled] { opacity: .5; pointer-events: none; }

    /* ---- Buttons ---- */
    button, [role="button"], input[type="submit"] {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: auto; height: 36px; padding: 8px 16px;
      border-radius: 8px; border: 1px solid transparent;
      font-family: var(--sans); font-size: 14px; font-weight: 500; line-height: 1;
      cursor: pointer;
      transition: color .15s var(--ease), background-color .15s var(--ease), border-color .15s var(--ease);
      /* primary (default) */
      background: var(--primary); color: var(--primary-foreground);
      box-shadow: none; text-decoration: none;
    }
    button:hover, [role="button"]:hover, input[type="submit"]:hover {
      background: color-mix(in srgb, var(--primary) 90%, transparent);
      color: var(--primary-foreground); border-color: transparent; text-decoration: none;
    }
    /* secondary + .contrast (quiet fill — never a second saturated color) */
    button.secondary, [role="button"].secondary, button.contrast, [role="button"].contrast {
      background: var(--secondary); color: var(--secondary-foreground); border-color: transparent;
    }
    button.secondary:hover, [role="button"].secondary:hover,
    button.contrast:hover, [role="button"].contrast:hover {
      background: color-mix(in srgb, var(--secondary) 80%, transparent);
      color: var(--secondary-foreground);
    }
    /* outline */
    button.outline, [role="button"].outline,
    button.secondary.outline, [role="button"].secondary.outline,
    button.contrast.outline, [role="button"].contrast.outline {
      background: var(--background); color: var(--foreground); border: 1px solid var(--border);
    }
    button.outline:hover, [role="button"].outline:hover,
    button.secondary.outline:hover, [role="button"].secondary.outline:hover,
    button.contrast.outline:hover, [role="button"].contrast.outline:hover {
      background: var(--muted); color: var(--foreground); border-color: var(--border);
    }
    /* Pico forces submit buttons to width:100%; Consermo buttons hug content. */
    button[type="submit"] { width: auto; }
    .btn-sm { height: 32px; padding: 6px 12px; font-size: 14px; }

    /* ---- Inputs / textareas / selects ---- */
    input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]), select, textarea {
      height: 36px; padding: 4px 12px;
      border: 1px solid var(--input); border-radius: 6px;
      background: var(--background); color: var(--foreground);
      font-family: var(--sans); font-size: 14px; line-height: 1.43;
      box-shadow: var(--shadow-xs);
    }
    select { padding-right: 2rem; }
    textarea { height: auto; min-height: 6rem; padding: 8px 12px; }
    textarea#idea { min-height: 10rem; }
    input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):focus-visible,
    select:focus-visible, textarea:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent);
    }
    input[aria-invalid="true"], textarea[aria-invalid="true"] {
      border-color: var(--blocked);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--blocked) 20%, transparent);
    }
    label { font-size: 14px; font-weight: 500; }
    code { font-family: var(--mono); font-size: var(--fs-xs); background: var(--muted);
      border: 1px solid var(--border); border-radius: 6px; padding: .05rem .3rem; color: var(--foreground); }

    /* ---- Cards (flat: 1px border, 12px radius, no shadow) ---- */
    article {
      background: var(--card); color: var(--card-foreground);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin: 0 0 12px; box-shadow: none;
    }
    article header { background: transparent; border-bottom: 0; padding: 0; margin: 0 0 8px; }
    article footer { background: transparent; border-top: 0; padding: 0; margin: 12px 0 0; }
    article header h3 { margin-bottom: 0; }
    .change-card article header h3 { font-size: 16px; }

    /* ---- Top header bar ---- */
    .topbar {
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 0 24px;
      background: var(--background); border-bottom: 1px solid var(--border);
    }
    /* Brand: primary square icon by grey wordmark. */
    .brand { display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; color: var(--muted-foreground); }
    .brand:hover { text-decoration: none; color: var(--muted-foreground); }
    .brand-mark { width: 20px; height: 20px; border-radius: 6px; background: var(--primary); flex: 0 0 auto; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    /* Pico gives buttons a bottom margin; zero it so both header buttons sit
       perfectly centered in the 56px bar and align with each other. */
    .topbar-actions button { margin: 0; }

    /* ---- App ---- */
    /* Step label: current-step marker (active-context treatment). */
    .step-label { display: inline-block; color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      border-radius: 8px; padding: 4px 10px;
      font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      margin: 0 0 20px; line-height: 1.3; }
    /* Skip-to-content link — visible only on keyboard focus. */
    .skip-link { position: absolute; left: -9999px; top: 0; z-index: 60;
      background: var(--primary); color: var(--primary-foreground);
      padding: 8px 12px; border-radius: 8px; }
    .skip-link:focus { left: 8px; top: 8px; }
    /* Past step 1, compress the masthead so the task — not the brand — owns the
       top of the page. Inner steps are HTMX fragments swapped into #wizard while
       the base masthead persists, so key off the step marker inside #wizard. */
    main.container:has(#wizard [data-step]:not([data-step="idea"])) hgroup { margin-bottom: .35rem; }
    main.container:has(#wizard [data-step]:not([data-step="idea"])) hgroup h1 {
      font-size: 24px; line-height: 1.18; letter-spacing: -0.02em; }
    main.container:has(#wizard [data-step]:not([data-step="idea"])) hgroup p { display: none; }
    /* Page shell: centered wizard column. Text-heavy steps read at 672px;
       the sections / final / moonshot views get more room. */
    main.container { max-width: 672px; padding-left: 24px; padding-right: 24px; }
    main.container:has(#wizard [data-step="sections"]),
    main.container:has(#wizard [data-step="final"]),
    main.container:has(#wizard [data-step="moonshot"]) { max-width: 896px; }
    @media (max-width: 640px) {
      main.container { padding-left: 16px; padding-right: 16px; }
      .topbar { padding: 0 16px; }
    }

    /* Generated / technical output: the mono block. */
    .section-content { white-space: pre-wrap; word-break: break-word;
      font-family: var(--mono); font-size: 13px; font-weight: 400; line-height: 1.45;
      color: var(--foreground); background: var(--muted);
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); }

    /* ---- ASCII spinner (frames driven by /static/spinner.js; single calm color,
            no rainbow — color cycling is disabled in the engine) ---- */
    .spinner { display: inline-block; font-family: var(--mono); white-space: pre; color: var(--muted-foreground); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes bubble-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes cursor-blink { 50% { opacity: 0; } }
    @keyframes modal-in { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }
    /* Motion is opt-in to comfort: kill the always-on loops (blink/pulse) and
       collapse entrances to an instant state for users who ask for less motion. */
    @media (prefers-reduced-motion: reduce) {
      .terminal::after, #status-bar::after,
      .party-turn:not(:empty) { animation: none; }
      .bubble { animation: none; }
      .seg-btn { transition: none; }
      .history-modal > article { animation: none; }
      .party-dock-toggle::before { transition: none; }
      /* (.spinner is JS-driven and already holds a single frame under reduce — see spinner.js) */
    }

    /* ---- Terminal-style activity block (#status-bar at top, .terminal reusable):
            a standard mono block with a prompt glyph — no custom near-black bg. ---- */
    #status-bar:empty { display: none; }
    .terminal, #status-bar {
      position: relative;
      padding: 8px 12px 8px 32px;
      font-family: var(--mono);
      font-size: 13px; line-height: 1.45;
      color: var(--foreground);
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      white-space: pre-wrap; word-break: break-word;
    }
    #status-bar { margin-bottom: 20px; }
    .terminal { margin-top: 8px; }
    /* shell prompt + blinking block cursor */
    .terminal::before, #status-bar::before { content: "❯"; position: absolute; left: 12px; color: var(--primary); font-weight: 700; }
    .terminal::after, #status-bar::after { content: "▋"; margin-left: .15rem; color: var(--primary); animation: cursor-blink 1.1s steps(1) infinite; }

    /* ---- Segmented button selectors (step 1 calibration) ---- */
    .seg-group { margin-bottom: 20px; }
    /* Repo-link row only appears once "existing codebase" is selected. */
    #repo-row { display: none; }
    form:has(input[name="project_type"][value="existing"]:checked) #repo-row { display: block; }
    .seg-legend { font-weight: 500; font-size: 14px; color: var(--foreground); margin-bottom: 8px; }
    .seg { display: flex; flex-wrap: wrap; gap: 8px; }
    .seg-btn { flex: 1 1 0; min-width: 8.5rem; display: flex; flex-direction: column; gap: 2px;
      margin: 0; padding: 10px 12px; cursor: pointer; position: relative;
      background: var(--background);
      border: 1px solid var(--input);
      border-radius: 8px;
      transition: border-color .15s var(--ease), background-color .15s var(--ease), box-shadow .15s var(--ease); }
    .seg-btn:hover { border-color: var(--ring); }
    .seg-btn input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; pointer-events: none; }
    /* checked = "active builder context" */
    .seg-btn:has(input:checked) { border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      box-shadow: inset 0 0 0 1px var(--primary); }
    .seg-btn:has(input:focus-visible) { border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent); }
    .seg-name { font-weight: 600; font-size: 14px; color: var(--foreground); }
    .seg-hint { color: var(--muted-foreground); font-size: var(--fs-xs); line-height: 1.33; }
    .refine-row { display: flex; gap: 8px; margin-top: 8px; }
    .refine-row select, .refine-row input { margin-bottom: 0; }
    .refine-row input { flex: 1 1 auto; }
    .assumption { color: var(--muted-foreground); font-size: var(--fs-xs); line-height: 16px; }
    .error { color: var(--blocked); }

    /* ---- Refine example chips ---- */
    .refine-examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ex-chip { font-size: var(--fs-xs); padding: 2px 10px; border: 1px solid var(--border);
      border-radius: 999px; text-decoration: none; color: var(--muted-foreground); cursor: pointer;
      background: transparent;
      transition: color .15s var(--ease), background-color .15s var(--ease), border-color .15s var(--ease); }
    .ex-chip:hover { border-color: var(--primary); color: var(--primary);
      background: color-mix(in srgb, var(--primary) 8%, transparent); text-decoration: none; }

    /* ---- Party mode group chat ---- */
    .chat { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto;
      padding: 8px; background: var(--background); border: 1px solid var(--border); border-radius: 8px; }
    .bubble { padding: 8px 12px; border-radius: 10px; background: var(--muted);
      border: 1px solid var(--border); animation: bubble-in .25s ease-out; }
    .bubble.facilitator { border-color: color-mix(in srgb, var(--primary) 45%, var(--border));
      background: color-mix(in srgb, var(--primary) 8%, var(--card)); }
    .bubble.system { background: transparent; border-style: dashed; font-size: var(--fs-xs);
      color: var(--muted-foreground); text-align: center; }
    .bubble .who { font-weight: 600; font-size: 14px; color: var(--foreground); }
    .bubble.facilitator .who { color: var(--attention-foreground); }
    [data-theme="dark"] .bubble.facilitator .who { color: var(--attention); }
    .bubble .who small { font-weight: 400; color: var(--muted-foreground); }
    .bubble .msg { white-space: pre-wrap; margin-top: 2px; }
    .party-turn { font-size: 14px; color: var(--muted-foreground); min-height: 1.2em; }
    .party-turn:not(:empty) { animation: pulse 1.6s ease-in-out infinite; }

    /* ---- Floating party-chat dock (popover surface) ---- */
    .party-dock { position: fixed; right: 16px; bottom: 4.75rem; z-index: 40;
      width: min(560px, calc(100vw - 32px));
      background: var(--popover); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: var(--shadow-overlay);
      display: flex; flex-direction: column; overflow: hidden; }
    .party-dock-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 16px; background: var(--popover); color: var(--foreground);
      border-bottom: 1px solid var(--border); }
    .party-dock-head strong { color: var(--foreground); font-size: 14px; font-weight: 600; }
    .party-dock.collapsed .party-dock-head { border-bottom: 0; }
    .party-dock-toggle { background: transparent; border: 0; color: var(--muted-foreground); cursor: pointer;
      width: auto; height: auto; margin: 0; padding: 0 4px; font-size: 1rem; line-height: 1; }
    .party-dock-toggle:hover { background: transparent; color: var(--foreground); }
    .party-dock-toggle::before { content: "▾"; display: inline-block; transition: transform .15s var(--ease); }
    .party-dock.collapsed .party-dock-toggle::before { transform: rotate(180deg); }
    .party-dock-body { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; }
    .party-dock.collapsed .party-dock-body { display: none; }
    .party-dock .chat { max-height: 44vh; border: 0; padding: 2px; }
    @media (max-width: 640px) { .party-dock { right: 8px; left: 8px; width: auto; } }

    /* ---- Fixed bottom action bar (per-step next-step / party buttons) ---- */
    .action-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center;
      padding: 10px 16px;
      background: color-mix(in srgb, var(--background) 92%, transparent);
      backdrop-filter: blur(6px);
      border-top: 1px solid var(--border); }
    .action-bar button, .action-bar a[role="button"] { margin-bottom: 0; width: auto; }
    .action-bar .bar-back { margin-right: auto; } /* Back pinned far-left; forward action stays rightmost */
    /* 3-zone variant: Back left, QA actions centered, party/finish right */
    .action-bar.bar-3 { justify-content: space-between; flex-wrap: nowrap; }
    .action-bar.bar-3 > .bar-left, .action-bar.bar-3 > .bar-right { flex: 1 1 0; display: flex; gap: 8px; align-items: center; min-width: 0; }
    .action-bar.bar-3 > .bar-right { justify-content: flex-end; }
    .action-bar.bar-3 > .bar-center { display: flex; gap: 8px; align-items: center; }
    @media (max-width: 768px) {
      .action-bar.bar-3 { flex-wrap: wrap; }
      .action-bar.bar-3 > .bar-left, .action-bar.bar-3 > .bar-center, .action-bar.bar-3 > .bar-right { flex: 1 1 100%; justify-content: center; }
    }
    .action-bar .bar-note { flex-basis: 100%; text-align: center; margin: 0 0 2px; }
    main.container { padding-bottom: 5.5rem; } /* clear the fixed action bar */
    .final-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .final-actions button, .final-actions a[role="button"] { margin-bottom: 0; }

    /* ---- Change cards: state = full border + faint tint, no side stripe ---- */
    .change-card article { transition: border-color .15s var(--ease), background-color .15s var(--ease); }
    .change-card.applied article { border-color: color-mix(in srgb, var(--safe) 50%, var(--border));
      background: color-mix(in srgb, var(--safe) 8%, var(--card)); }
    .change-card.denied { opacity: .55; }
    .change-card.denied article { border-color: color-mix(in srgb, var(--blocked) 45%, var(--border)); }

    /* ---- Client-side history (home page) ---- */
    #history { margin-top: 20px; }
    #history summary { font-size: 14px; font-weight: 500; color: var(--foreground); }
    .hist-list { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
    .hist-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card);
      transition: background-color .15s var(--ease); }
    .hist-item:hover { background: color-mix(in srgb, var(--muted) 50%, transparent); }
    .hist-idea { grid-column: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-meta { grid-column: 1; }
    .hist-actions { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
    .hist-actions a, .hist-actions button { margin-bottom: 0; height: 32px; padding: 6px 12px; font-size: var(--fs-xs); width: auto; }

    /* ---- History modal (dialog recipe) ---- */
    .history-modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center;
      justify-content: center; padding: 16px; z-index: 50; }
    .history-modal > article { max-width: 760px; width: 100%; margin: 0;
      border: 1px solid var(--border); border-radius: 16px; padding: 24px;
      background: var(--background); box-shadow: var(--shadow-overlay);
      animation: modal-in .2s var(--ease); }
    .history-modal > article header strong { font-size: 16px; font-weight: 600; }

    /* ---- Settings panel ---- */
    #settings-panel { margin-bottom: 20px; }
    #settings-panel header button { height: auto; padding: 2px 8px; border: 0; background: transparent;
      color: var(--foreground); opacity: .7; }
    #settings-panel header button:hover { opacity: 1; background: transparent; }

    /* Touch targets: keep the compact desktop look, but guarantee a ≥44px
       hit area on touch/coarse pointers for the small chips & icon buttons. */
    @media (pointer: coarse) {
      .ex-chip, .hist-actions a, .hist-actions button, .party-dock-toggle, .topbar-actions button {
        min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
      }
    }
  </style>
</head>
<body>
<a href="#wizard" class="skip-link">Skip to content</a>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Incipit</a>
  <div class="topbar-actions">
    <button type="button" class="secondary outline btn-sm"
            hx-get="/settings" hx-target="#settings-region" hx-swap="innerHTML">Model settings</button>
    <button type="button" id="theme-toggle" class="secondary outline btn-sm"
            aria-label="Switch color theme (cycles system, dark, light)">Theme: System</button>
  </div>
</header>
<main class="container">
  <hgroup>
    <h1>Incipit</h1>
    <p><em>here begins</em> — idea → structured mega-prompt, BMAD-style, in minutes.</p>
  </hgroup>
  <div id="settings-region"></div>
  <div id="wizard" tabindex="-1">
    {% block content %}{% endblock %}
  </div>
</main>
<script>
  // Keep the party-mode chat pinned to the newest message. Bubbles append via
  // the SSE extension's sse-swap, which fires htmx:sseMessage (not
  // htmx:afterSwap), so listen for both — plus afterSettle for the initial
  // server-rendered list when the panel first loads.
  function scrollPartyChat() {
    var chat = document.getElementById('party-chat');
    if (chat) chat.scrollTop = chat.scrollHeight;
  }
  ['htmx:sseMessage', 'htmx:afterSwap', 'htmx:afterSettle'].forEach(function (ev) {
    document.body.addEventListener(ev, scrollPartyChat);
  });

  // Theme toggle: cycles system → dark → light, persists to localStorage, and
  // re-applies the pre-paint resolution logic on each change.
  (function () {
    var KEY = "incipit-theme";
    var btn = document.getElementById("theme-toggle");
    function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function store(v) { try { v === null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, v); } catch (e) {} }
    function systemDark() { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
    function apply() {
      var pref = stored();
      var dark = pref === "dark" || (pref !== "light" && systemDark());
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      var label = pref === "dark" ? "Dark" : pref === "light" ? "Light" : "System";
      if (btn) btn.textContent = "Theme: " + label;
    }
    if (btn) btn.addEventListener("click", function () {
      var pref = stored();
      store(pref === null ? "dark" : pref === "dark" ? "light" : null);
      apply();
    });
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (stored() === null) apply();
      });
    }
    apply();
  })();
</script>
</body>
</html>
